[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "evalkit-agents"
dynamic = ["version"]
description = "Evaluate and debug LLM agents: trace capture, pluggable scorers, golden datasets, replay and CI gates. LangGraph first."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "EvalKit contributors" }]
keywords = ["llm", "agents", "evaluation", "langgraph", "tracing", "testing", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
anthropic = ["anthropic>=0.40"]
dev = [
    "evalkit-agents[langgraph,otel]",
    "tomli>=2.0",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[project.scripts]
evalkit = "evalkit.cli:main"

[project.entry-points.pytest11]
evalkit = "evalkit.pytest_plugin"

[project.urls]
Homepage = "https://github.com/depuc8/EvalKit"
Documentation = "https://depuc8.github.io/EvalKit"
Changelog = "https://github.com/depuc8/EvalKit/blob/main/CHANGELOG.md"
Issues = "https://github.com/depuc8/EvalKit/issues"

[tool.hatch.version]
path = "src/evalkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/evalkit"]

[tool.hatch.build.targets.sdist]
include = ["src/evalkit", "tests", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --cov=evalkit --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["evalkit"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "PIE", "RET"]
ignore = ["RET504", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"src/evalkit/__init__.py" = ["F401"]
"tests/**" = ["B011", "PT018", "E501", "RUF012", "RUF005", "SIM117"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/evalkit"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["langchain_core.*", "langgraph.*", "opentelemetry.*", "anthropic.*"]
ignore_missing_imports = true
follow_imports = "skip"
